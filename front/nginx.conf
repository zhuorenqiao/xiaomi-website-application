server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # SPA 路由回退：找不到文件时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源：长期缓存（Vite 产物文件名含 content hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即可见
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 图片等媒体文件缓存 7 天
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
}
