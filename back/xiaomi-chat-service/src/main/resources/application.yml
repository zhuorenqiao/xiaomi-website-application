server:
  port: 8860

spring:
  application:
    name: xiaomi-chat-server

# 聊天服务配置
chat:
  cors:
    # 前端开发服务器来源；生产环境请改为实际域名
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  stream:
    # 模拟回复的推送节奏：与前端 Ant Design X 联调时可见逐字输出
    interval-ms: 120
    chars-per-chunk: 3
  llm:
    # OpenAI 兼容服务地址与模型，可按需切换厂商：
    #   智谱 GLM:   https://open.bigmodel.cn/api/paas/v4        model: glm-4-flash（免费）/ glm-4-plus
    #   DeepSeek:   https://api.deepseek.com                    model: deepseek-chat
    #   Moonshot:   https://api.moonshot.cn/v1                  model: moonshot-v1-8k
    #   通义千问:    https://dashscope.aliyuncs.com/compatible-mode/v1   model: qwen-plus
    #   OpenAI:     https://api.openai.com/v1                   model: gpt-4o-mini
    base-url: https://api.deepseek.com
    model: deepseek-chat
    # API Key 通过环境变量注入（export CHAT_LLM_API_KEY=xxx），未配置时服务退回内置模拟回复
    api-key: ${CHAT_LLM_API_KEY:}
    temperature: 0.7
    # 单次大模型请求超时（秒）
    timeout-seconds: 60
    # 随请求携带的最大历史消息条数（控制上下文长度）
    max-history-messages: 20
    system-prompt: 你是小米商城的在线客服助手「小爱」，回答简洁友好；只讨论与小米产品、订单和售后服务相关的话题，其他话题礼貌引导回商城业务。
